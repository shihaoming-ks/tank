<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>坦克竞技场</title>
    <link rel="stylesheet" href="/styles/main.css" />
  </head>
  <body>
    <!-- ========== 顶部状态条 ========== -->
    <div class="topbar">
      <span class="brand">坦克竞技场</span>
      <label class="theme-switch" for="theme-select">
        <span>主题</span>
        <select id="theme-select" aria-label="选择视觉主题">
          <option value="industrial">军械终端</option>
          <option value="pixel">像素街机</option>
          <option value="cartoon">手绘战术</option>
          <option value="neon">霓虹赛博</option>
        </select>
      </label>
      <span class="conn"><i id="status-dot" class="dot dot-pending"></i><span id="status">连接中…</span></span>
    </div>

    <!-- ========== 视图 1：大厅 ========== -->
    <main id="view-lobby" class="view">
      <div class="panel">
        <header class="panel-head">
          <h1>进入战场</h1>
          <p class="subtitle">2 ~ 4 名玩家 · 服务端权威裁决</p>
        </header>

        <label class="field">
          <span class="field-label">你的昵称</span>
          <input id="input-nickname" class="input" type="text" maxlength="12" placeholder="1 ~ 12 个字符" autocomplete="off" />
        </label>

        <button id="btn-create" class="btn btn-primary">创建房间</button>

        <div class="divider"><span>或加入已有房间</span></div>

        <label class="field">
          <span class="field-label">房间号</span>
          <div id="room-code" class="room-code">
            <!-- 单 input + CSS letter-spacing 伪造 4 格，彻底消除跨格跳焦问题 -->
            <input id="input-roomcode"
              class="room-code-input"
              type="text"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="4"
              autocomplete="one-time-code"
              placeholder="0000"
              aria-label="4 位房间号"
            />
            <input id="input-roomid" type="hidden" />
          </div>
        </label>

        <button id="btn-join" class="btn">加入房间</button>

        <p id="lobby-error" class="error-text" hidden></p>
      </div>
    </main>

    <!-- ========== 视图 2：房间等待区 ========== -->
    <main id="view-room" class="view" hidden>
      <div class="panel">
        <header class="panel-head panel-head-row">
          <div>
            <h1>房间 <span id="room-id" class="mono-hl">----</span></h1>
            <p class="subtitle">把房间号告诉队友，即可加入同一局</p>
          </div>
          <button id="btn-copy" class="btn-ghost" title="复制房间号">复制</button>
        </header>

        <div class="roster-head">
          <span>玩家列表</span>
          <span id="roster-count" class="mono-dim">0 / 4</span>
        </div>
        <ul id="roster" class="roster"></ul>

        <p id="room-hint" class="hint-text"></p>

        <button id="btn-start" class="btn btn-primary" hidden>开始对战</button>
        <button id="btn-leave" class="btn btn-danger">离开房间</button>

        <p id="room-error" class="error-text" hidden></p>
      </div>
    </main>

    <!-- ========== 视图 3：对战 ========== -->
    <main id="view-game" class="view view-game" hidden>
      <div class="hud">
        <div class="hud-left">
          <span class="hud-room">房间 <b id="game-room-id" class="mono-hl">----</b></span>
        </div>
        <div id="hud-players" class="hud-players"></div>
        <div class="hud-right">
          <span id="hud-timer" class="hud-timer">--:--</span>
          <button id="btn-leave-game" class="btn-ghost">离开</button>
        </div>
      </div>

      <canvas id="canvas" class="canvas"></canvas>

      <div class="game-foot">
        <div class="controls-hint">
          <span><b>W A S D</b> / <b>方向键</b> 移动</span>
          <span><b>空格</b> 射击</span>
        </div>
        <button id="btn-restart" class="btn-ghost" hidden>再来一局</button>
      </div>

      <!-- 战报：记录进出房间、命中、击杀等事件 -->
      <section class="feed-wrap">
        <div class="feed-head">
          <span>战报</span>
          <button id="btn-feed-clear" class="btn-mini">清空</button>
        </div>
        <ul id="feed" class="feed"></ul>
      </section>
    </main>

    <!-- ========== 结算面板 ========== -->
    <div id="overlay-over" class="overlay" hidden>
      <div class="overlay-box overlay-result">
        <p id="over-reason" class="over-reason">对局结束</p>
        <h2 id="over-title">胜者</h2>
        <table class="score">
          <thead>
            <tr>
              <th>玩家</th>
              <th>击杀</th>
              <th>剩余血量</th>
            </tr>
          </thead>
          <tbody id="score-body"></tbody>
        </table>
        <div class="over-actions">
          <button id="btn-again" class="btn btn-primary">再来一局</button>
          <button id="btn-back-lobby" class="btn">返回大厅</button>
        </div>
        <p id="over-hint" class="hint-text"></p>
      </div>
    </div>

    <!-- ========== 全局提示 ==========
         错误提示统一走这里：固定定位、始终可见，
         避免写进当前隐藏视图内的元素而导致"点击无反应" -->
    <div id="toast" class="toast" hidden></div>

    <!-- ========== 断连遮罩 ========== -->
    <div id="overlay-disconnect" class="overlay" hidden>
      <div class="overlay-box">
        <h2>连接已断开</h2>
        <p id="disconnect-reason">与服务器的连接中断。</p>
        <button class="btn btn-primary" onclick="location.reload()">刷新重连</button>
      </div>
    </div>

    <!-- ========== 重复标签页遮罩 ========== -->
    <div id="overlay-duplicate" class="overlay" hidden>
      <div class="overlay-box">
        <h2>已在另一窗口游戏中</h2>
        <p>每个浏览器只允许同时打开一个坦克竞技场窗口。</p>
        <p class="hint-text">请关闭另一个窗口，此页面将自动解锁。</p>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
